name: Deploy site to Cloudflare Pages

# النشر على Pages منفصل عن نشر الـWorker: لو رفضت Cloudflare مسارات الـWorker
# (النطاق في حساب آخر) يبقى الموقع منشوراً، والوسيط في functions/ يصل للـWorker
# عبر عنوانه المباشر. لا يعتمد على أي صلاحية على النطاق.
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'functions/**'
      - 'vercel.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=goldenstore-new --branch=main --commit-dirty=true
