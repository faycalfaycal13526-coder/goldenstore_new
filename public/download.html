<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100%;
  background: #0d0d0f;
  color: #e8e8ea;
  font-family: 'Tajawal', 'Roboto', system-ui, sans-serif;
}
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px 20px 92px;
}
.wrap { width: 100%; max-width: 380px; }
.toolbar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
.logo {
  width: 112px;
  height: 112px;
  border-radius: 26px;
  margin: 0 auto 18px;
  box-shadow: 0 16px 48px rgba(0,0,0,.4);
}
.name { font-size: 32px; font-weight: 800; margin-bottom: 10px; letter-spacing: -.5px; }
.name b { color: #f4c01f; }
.tagline { font-size: 16px; color: #a8abb3; margin-bottom: 22px; line-height: 1.6; }
.download-counter {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  min-height: 74px; padding: 12px 16px; margin-bottom: 18px;
  border: 1px solid rgba(244,192,31,.2); border-radius: 18px;
  background: linear-gradient(135deg, rgba(244,192,31,.1), rgba(255,255,255,.02));
}
.counter-icon {
  width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
  flex: 0 0 auto; border-radius: 14px; color: #f4c01f;
  background: rgba(244,192,31,.14); font-size: 22px; font-weight: 800;
}
.counter-copy { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0; }
.counter-number { font-size: 22px; line-height: 1.15; font-weight: 800; font-variant-numeric: tabular-nums; color: #f4c01f; }
.counter-label { color: #a8abb3; font-size: 13px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  width: 100%; min-height: 54px; padding: 14px 24px; border-radius: 999px;
  background: linear-gradient(135deg, #f4c01f 0%, #ffd34d 100%);
  color: #062e6f; font-weight: 800; font-size: 18px; text-decoration: none;
  border: none; cursor: pointer; box-shadow: 0 10px 32px rgba(244,192,31,.25);
  transition: transform .08s, filter .15s;
}
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: scale(.98); }
.btn:focus-visible, .lang-btn:focus-visible, .lang-item:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.btn.no-link, .btn[aria-disabled="true"] {
  background: #2e2e33; color: #82858d; cursor: not-allowed; box-shadow: none;
}
.download-help { margin-top: 12px; min-height: 20px; color: #82858d; font-size: 12px; line-height: 1.5; }
.lang-switch { position: relative; display: inline-flex; z-index: 2; }
.lang-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  min-height: 36px; padding: 4px 10px; border-radius: 999px;
  border: 1px solid #2e2e33; background: #1b1b1f; color: #e8e8ea;
  font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
}
.lang-btn .icon { width: 18px; height: 18px; }
.lang-code { letter-spacing: .35px; }
.lang-menu {
  display: none; position: absolute; top: calc(100% + 6px); inset-inline-end: 0;
  min-width: 154px; padding: 6px; border: 1px solid #2e2e33; border-radius: 14px;
  background: #1b1b1f; box-shadow: 0 12px 32px rgba(0,0,0,.45);
}
.lang-switch.open .lang-menu { display: flex; flex-direction: column; gap: 2px; }
.lang-item {
  width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; text-align: start;
  background: transparent; color: #e8e8ea; font: inherit; font-size: 13px; cursor: pointer;
}
.lang-item:hover, .lang-item.on { background: #2c2c31; color: #ffd34d; }
#sticky-banner {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  text-align: center; background: rgba(13,13,15,.95); padding: 5px 0;
}
@media (max-width: 360px) {
  body { padding-inline: 16px; }
  .logo { width: 96px; height: 96px; }
  .name { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
</style>

</head>
<body>
<main class="wrap">
  <div class="toolbar" id="languageSwitcher" aria-label="Language selector"></div>
  <img class="logo" src="/images/logo.png" alt="Golden Store">
  <div class="name" dir="ltr">Golden<b>Store</b></div>
  <p class="tagline">Golden Store<br>أفضل متجر للتطبيقات المجانية</p>
  <section id="downloadCounter" class="download-counter" role="status" aria-live="polite" aria-atomic="true">
    <span class="counter-icon" aria-hidden="true">↓</span>
    <div class="counter-copy">
      <strong id="downloadCount" class="counter-number">—</strong>
      <span id="downloadCountLabel" class="counter-label">إجمالي التنزيلات</span>
    </div>
  </section>
  <a id="downloadBtn" class="btn no-link" href="#" aria-disabled="true">تحميل</a>
  <p id="downloadHelp" class="download-help"></p>
</main>
