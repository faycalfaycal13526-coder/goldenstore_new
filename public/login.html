<script>try{var _th=localStorage.getItem("gs_theme")==="light"?"light":"dark";document.documentElement.setAttribute("data-theme",_th);var _lg=localStorage.getItem("gs_lang")||"ar";if(["ar","en","fr","es"].indexOf(_lg)<0)_lg="ar";document.documentElement.lang=_lg;document.documentElement.dir=_lg==="ar"?"rtl":"ltr";}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<title>تسجيل الدخول — Golden Store</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/images/logo.png">
<link rel="apple-touch-icon" href="/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<script id="gs-apk-self-heal">
(function(){
  try {
    var del = JSON.parse(localStorage.getItem('gs_deleted_apks') || '[]');
    if (!Array.isArray(del)) del = [];
    var states = JSON.parse(localStorage.getItem('gs_apk_states') || '{}') || {};
    var changed = false;
    Object.keys(states).forEach(function(k){
      var s = states[k];
      var sfn = (s && s.filename) || '';
      var dead = false;
      try { dead = !!sfn && (JSON.parse(localStorage.getItem('gs_dead_apk_files') || '[]') || []).indexOf(sfn) >= 0; } catch (e2) {}
      if (del.indexOf(k) >= 0 || !s || s.status === 'none' ||
          ((s.status === 'downloaded' || s.status === 'installing') && (!s.filename || dead))) {
        delete states[k]; changed = true;
      }
    });
    if (changed) localStorage.setItem('gs_apk_states', JSON.stringify(states));
    var active = JSON.parse(localStorage.getItem('gs_active_dl') || '{}') || {};
    var changedActive = false;
    Object.keys(active).forEach(function(k){
      if (del.indexOf(k) >= 0) { delete active[k]; changedActive = true; }
    });
    if (changedActive) localStorage.setItem('gs_active_dl', JSON.stringify(active));
  } catch (e) {}
})();
</script>
</head>
<body data-page="login">
  <div class="auth-page" id="gate">
    <!-- top row: back arrow + title, exactly like the reference layout -->
    <h1 class="auth-sr" data-auth-title>تسجيل الدخول</h1>

    <!-- Round 40: the green mascot is gone — the GoldenStore logo is back -->
    <div class="auth-hero" id="authHero">
      <img class="auth-hero-logo" src="/images/logo.png" alt="Golden Store" width="96" height="96">
      <div class="auth-hero-name">Golden<b>Store</b></div>
      <p class="auth-hero-tag">Golden Store, Play More Fun!</p>
    </div>

    <form class="auth-form" id="authForm" novalidate>
      <!-- Round 39: create-account extras (hidden while signing in) -->
      <label class="auth-field auth-box" for="username" id="nameRow" style="display:none">
        <span class="auth-field-label">اسم المستخدم*</span>
        <input id="username" name="username" type="text" maxlength="50" autocomplete="username"
               placeholder="اسم المستخدم (4-50 حرف)" aria-label="اسم المستخدم">
      </label>

      <label class="auth-field auth-box" for="email">
        <span class="auth-field-label">عنوان بريد إلكتروني</span>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email"
               dir="ltr" placeholder="البريد الإلكتروني (اختياري)" aria-label="البريد الإلكتروني" required>
      </label>

      <label class="auth-field auth-box" for="password">
        <span class="auth-field-label">كلمه السر*</span>
        <input id="password" name="password" type="password" autocomplete="current-password"
               dir="ltr" placeholder="كلمة المرور (6-8 أحرف)" aria-label="كلمة المرور" required minlength="6">
        <button class="auth-eye" id="eye" type="button" aria-label="إظهار كلمة المرور" title="إظهار كلمة المرور">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
      </label>

      <label class="auth-field auth-box" for="country" id="countryRow" style="display:none">
        <span class="auth-field-label">الدولة</span>
        <input id="country" name="country" type="text" maxlength="60" autocomplete="country-name"
               placeholder="الدولة (اختياري)" aria-label="الدولة">
      </label>

      <label class="auth-field auth-box" for="gender" id="genderRow" style="display:none">
        <span class="auth-field-label">الجنس</span>
        <select id="gender" name="gender" aria-label="الجنس">
          <option value="">اختر الجنس</option>
          <option value="male">ذكر</option>
          <option value="female">أنثى</option>
          <option value="other">آخر</option>
          <option value="prefer_not">أفضّل عدم التحديد</option>
        </select>
      </label>

      <label class="auth-field auth-box" for="age" id="ageRow" style="display:none">
        <span class="auth-field-label">العمر</span>
        <input id="age" name="age" type="number" min="10" max="110" inputmode="numeric"
               placeholder="العمر (اختياري)" aria-label="العمر">
      </label>

      <label class="auth-field auth-box" for="phone" id="phoneRow" style="display:none">
        <span class="auth-field-label">رقم هاتف</span>
        <input id="phone" name="phone" type="tel" maxlength="24" inputmode="tel" dir="ltr"
               placeholder="رقم الهاتف (اختياري)" aria-label="رقم هاتف">
      </label>

      <div class="auth-links">
        <button class="auth-textbtn" id="forgot" type="button">نسيت كلمة المرور؟</button>
        <button class="auth-textbtn" id="toRegister" type="button">إنشاء حساب جديد</button>
      </div>

      <!-- mandatory Terms + Privacy consent (built by /js/legal.js) -->
      <div class="legal-consent" id="consent"></div>

      <button class="auth-submit" id="submit" type="submit" disabled>تسجيل الدخول</button>
      <div class="gate-spinner" id="checking"><div class="spinner"></div></div>
      <div class="gate-error hidden" id="error"></div>
      <p class="auth-note" id="authNote">قم بتسجيل حسابك بالبريد الإلكتروني الخاص بك</p>
    </form>

    <div class="auth-third">
      <div class="auth-third-title">تسجيل الدخول السريع لحساب الطرف الثالث</div>
      <label class="auth-invite" for="invite">
        <input id="invite" type="text" placeholder="كود الدعوة (اختياري)" aria-label="كود الدعوة (اختياري)">
      </label>
      <button class="auth-google-big" id="signin" type="button" aria-label="متابعة باستخدام Google" title="متابعة باستخدام Google">
        <svg class="gico" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span class="gbtn-label">متابعة باستخدام Google</span>
      </button>
      <div class="auth-third-foot">
        <span class="auth-third-brand">متصفح</span>
        <span class="auth-third-sub">الجوجل</span>
      </div>
    </div>

    <div class="gate-legal" id="legalLinks"></div>
    <!-- Facebook-splash style attribution: the word "from" with the supplied
         brand lockup directly beneath it, at the bottom of the sign-in gate.
         Purely decorative: no link, no sign-in action, no pointer events. -->
    <div class="gs-from" role="img" aria-label="from The Pirate Bay">
      <span class="gs-from-label">from</span>
      <img class="gs-from-mark" src="/images/from-brand-blue.png" alt="The Pirate Bay" width="612" height="96">
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>

  <script src="/js/lang.js?v=20261120q"></script>
  <script src="/js/legal.js?v=20261120q"></script>
  <script src="/js/firebase-auth.js?v=20261120q"></script>
  <script src="/js/notifications.js?v=20261120q"></script>
  <script src="/js/login.js?v=20261120q"></script>
  <script src="/js/notification-hub.js?v=20261120q"></script>
</body>
</html>
