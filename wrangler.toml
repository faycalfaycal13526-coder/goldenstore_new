name = "goldenstore-api"
main = "api/[[...path]].ts"
compatibility_date = "2026-10-05"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# The website routes keep same-origin /api/* calls working on the custom domain.
# api.goldenstore.online is a Worker Custom Domain used by the Pages/Vercel proxies.
# The goldenstore.online zone must be active in this Cloudflare account.
routes = [
  { pattern = "goldenstore.online/api/*", zone_name = "goldenstore.online" },
  { pattern = "www.goldenstore.online/api/*", zone_name = "goldenstore.online" },
  { pattern = "api.goldenstore.online", custom_domain = true }
]

[vars]
ADMIN_USERNAME = "admin"
ALLOWED_ORIGINS = "https://goldenstore.online,https://www.goldenstore.online,https://goldenstore-new.pages.dev"
STORE_NAME = "Goldenstore"
STORE_DOMAIN = "goldenstore.online"
STORE_LOGO_URL = "https://goldenstore.online/images/logo.png"
R2_BUCKET = "goldenstore-apks"
R2_ACCOUNT_ID = "3d6027f4b14f48a62a2dba1db3f8d082"
R2_PUBLIC_URL = "https://cdn.goldenstore.online"
FIREBASE_PROJECT_ID = "golden-store-40dd6"

# ============================================================
# D1 Database Binding
# ============================================================
[[d1_databases]]
binding = "DB"
database_name = "goldenstore-db"
database_id = "9c6add06-82cd-4c99-9c1d-907a9aa9957e"
