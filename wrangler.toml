name = "goldenstore-api"
main = "api/[[...path]].ts"
compatibility_date = "2026-10-05"
compatibility_flags = ["nodejs_compat"]

# workers_dev belongs at the TOP LEVEL — never under [triggers]. When it sits
# inside [triggers], wrangler prints «Unexpected fields found in triggers field»
# and silently DROPS it while the deploy still exits 0.
workers_dev = true

# ── Routes are DISABLED, deliberately ────────────────────────────────────────
# They cannot be applied: the zone goldenstore.online is not reachable with this
# account's credentials, so wrangler fails every deploy with
#     The zone "goldenstore.online" does not exist on your account. [code: 10084]
#     Can't infer zone from route, please specify zone for "api.goldenstore.online" [10082]
# and api.goldenstore.online stays on Cloudflare's 100:: placeholder (no Worker
# bound). That unbound hostname was the source of the 522 outage: the Pages proxy
# in functions/api/[[path]].ts forwarded /api/* to it and timed out.
#
# The proxy now calls the Worker's workers.dev hostname instead, which works with
# zero zone permissions — so nothing needs these routes. Uncomment them (and move
# the zone into the account that owns the deploy token) to serve /api/* straight
# from the custom domain again.
#
# routes = [
#   { pattern = "goldenstore.online/api/*", zone_name = "goldenstore.online" },
#   { pattern = "www.goldenstore.online/api/*", zone_name = "goldenstore.online" },
#   { pattern = "api.goldenstore.online", custom_domain = true }
# ]

# Process scheduled pushes every 5 minutes (Advanced Push System).
[triggers]
crons = ["*/5 * * * *"]

[vars]
ADMIN_USERNAME = "admin"
ALLOWED_ORIGINS = "https://goldenstore.online,https://www.goldenstore.online,https://goldenstore-new.pages.dev"
STORE_NAME = "Goldenstore"
STORE_DOMAIN = "goldenstore.online"
STORE_LOGO_URL = "https://goldenstore.online/images/logo.png"
R2_BUCKET = "goldenstore"
R2_ACCOUNT_ID = "3d6027f4b14f48a62a2dba1db3f8d082"
# Served by R2's public development URL directly. The owner has replaced the
# bucket twice: the first hostname 404'd (bucket deleted) and the second began
# answering 401 (its public development URL was switched off), which is why the
# store showed no files at all. This is the third bucket's public URL. Changing
# this ONE value fixes every URL the API generates — icons, screenshots, video
# thumbnails and APK links — and the console's own health panel reads it back, so
# a mismatch is visible instead of guessed. A custom domain can replace it later.
R2_PUBLIC_URL = "https://pub-c44b01728ce5456685569f9e4981c04e.r2.dev"
FIREBASE_PROJECT_ID = "golden-store-40dd6"
# Public zone identifier (NOT a secret). Also auto-discovered from
# STORE_DOMAIN when absent. Only CF_API_TOKEN needs to be a Worker secret.
CF_ZONE_ID = "82b8bc2ce85467ebf142cd63469b8d6e"

# ============================================================
# Cloudflare GraphQL Analytics (for the admin dashboard)
# Set these as WORKER SECRETS, never here:
#   npx wrangler secret put CF_API_TOKEN    # token with Account/Zone "Analytics:Read"
#   npx wrangler secret put CF_ACCOUNT_ID   # account tag (or reuse R2_ACCOUNT_ID below)
#   npx wrangler secret put CF_ZONE_ID      # only for zone-scoped tokens
# Diagnose from the dashboard: "الإحصائيات" -> "اختبار الاتصال / تشخيص",
# or GET /api/admin/push/cloudflare (admin session required).
# ============================================================

# ============================================================
# D1 Database Binding
# ============================================================
[[d1_databases]]
binding = "DB"
database_name = "goldenstore-db"
database_id = "9c6add06-82cd-4c99-9c1d-907a9aa9957e"
